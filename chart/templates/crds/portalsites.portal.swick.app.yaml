# @spec K8S-009
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: portalsites.portal.swick.app
spec:
  group: portal.swick.app
  names:
    kind: PortalSite
    plural: portalsites
    singular: portalsite
    shortNames:
      - ps
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                name:
                  type: string
                  minLength: 1
                  pattern: '\S'
                description:
                  type: string
                url:
                  type: string
                icon:
                  type: string
                categories:
                  type: array
                  items:
                    type: string
                roles:
                  type: array
                  items:
                    type: string
                usageInstructions:
                  type: string
                apps:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      scheme:
                        type: string
                      store:
                        type: string
                        pattern: '^(?i:(none|apple|macos|google|microsoft|windows|linux))?$'
                      storeId:
                        type: string
                    required:
                      - name
                      - storeId
                isPrivate:
                  type: boolean
                isInternal:
                  type: boolean
                contentRef:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      minLength: 1
                  required:
                    - name
                workloadRef:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    kind:
                      type: string
                      enum: [Deployment, StatefulSet, ReplicaSet]
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                    namespace:
                      type: string
                  x-kubernetes-validations:
                    - rule: '!has(self.__namespace__)'
                      message: workloadRef must use the PortalSite namespace
