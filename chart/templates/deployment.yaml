apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-portal
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-portal
    spec:
      serviceAccountName: {{ .Release.Name }}-portal
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORTAL_PROVIDER
              value: kubernetes
            - name: PORTAL_KUBERNETES_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: Oidc__Authority
              value: {{ required "oidc.authority is required" .Values.oidc.authority | quote }}
            - name: Oidc__ClientId
              value: {{ required "oidc.clientId is required" .Values.oidc.clientId | quote }}
            - name: Oidc__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ required "oidc.existingSecret is required" .Values.oidc.existingSecret | quote }}
                  key: {{ required "oidc.clientSecretKey is required" .Values.oidc.clientSecretKey | quote }}
            - name: Oidc__RequireHttpsMetadata
              value: {{ .Values.oidc.requireHttpsMetadata | quote }}
          ports:
            - containerPort: 8081
