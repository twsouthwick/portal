image:
  repository: ghcr.io/twsouthwick/portal
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

oidc:
  authority: ""
  clientId: portal-web
  existingSecret: ""
  clientSecretKey: client-secret
  requireHttpsMetadata: true

# Trust X-Forwarded-Proto/For from the ingress that terminates TLS. Portal must
# be reachable only through that proxy while this is enabled.
forwardedHeaders:
  enabled: true

exampleResources:
  enabled: false

rbac:
  create: true
