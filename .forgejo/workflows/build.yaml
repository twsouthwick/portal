name: Build and Push Container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.swick.cloud

jobs:
  build:
    runs-on: docker
    container:
      image: registry.swick.cloud/swick-forgejo:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Build
        run: dotnet build Portal.slnx --no-restore --configuration Release

      - name: Determine version
        id: version
        run: |
          dotnet tool install --global minver-cli
          export PATH="$PATH:$HOME/.dotnet/tools"
          echo "VERSION=$(minver --tag-prefix v)" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          mkdir -p ~/.docker
          echo '{"auths":{"${{ env.REGISTRY }}":{"auth":"'$(echo -n '${{ secrets.REGISTRY_USERNAME }}:${{ secrets.REGISTRY_PASSWORD }}' | base64)'"}}}' > ~/.docker/config.json

      - name: Publish container
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          dotnet publish Portal.Web/Portal.Web.csproj \
            -c Release \
            --no-restore \
            /t:PublishContainer \
            /p:ContainerRegistry=${{ env.REGISTRY }} \
            /p:ContainerImageTags='"${{ steps.version.outputs.VERSION }};latest"' \
            /p:Version=${{ steps.version.outputs.VERSION }} \
            /p:ContainerImageFormat=OCI
