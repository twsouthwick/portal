name: Android debug smoke

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Client/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools

      - name: Install Android SDK and Rust target
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-linux-android

      - name: Install client dependencies
        run: npm ci --prefix Portal.Client

      - name: Install Android UI automation
        run: |
          npm install --global appium@4.0.1
          appium driver install uiautomator2@10.4.0

      - name: Build x86_64 debug APK
        working-directory: Portal.Client
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          npm run tauri -- android build --ci --debug --apk --target x86_64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-android-x86_64-debug-apk
          path: Portal.Client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, smoke test, and run shared UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash Portal.Client/scripts/android-smoke.sh install
            bash Portal.Client/scripts/android-smoke.sh smoke
            bash Portal.Client/scripts/android-smoke.sh ui

      - name: Upload Android smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-android-x86_64-ui-smoke
          path: Portal.Client/artifacts/
          if-no-files-found: warn
