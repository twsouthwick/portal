name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Client/package-lock.json

      - name: Set up Rust MSVC
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc -vV

      - name: Install client dependencies
        run: npm ci --prefix Portal.Client

      - name: Build debug shell
        working-directory: Portal.Client
        run: npm run tauri -- build --debug --no-bundle

      - name: Verify WebView2 and smoke test window
        run: ./Portal.Client/smoke-windows.ps1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Web/package-lock.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$HOME/.aspire/bin" aspire.cli --version 17.0.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.15.4

      - name: Install frontend dependencies
        run: npm ci --prefix Portal.Web

      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Build
        run: dotnet build Portal.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Portal.slnx --no-build --configuration Release

      - name: Lint Helm chart
        run: >-
          helm lint ./chart
          --set oidc.authority=https://identity.example.com
          --set oidc.existingSecret=portal-oidc

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Web/package-lock.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$HOME/.aspire/bin" aspire.cli --version 17.0.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.15.4

      - name: Install frontend dependencies
        run: npm ci --prefix Portal.Web

      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Determine package names and version
        id: package
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          owner="${repository%%/*}"
          version="$(dotnet msbuild Portal.Web/Portal.Web.csproj -target:MinVer -getProperty:MinVerVersion)"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Publish container
        env:
          IMAGE_REPOSITORY: ${{ steps.package.outputs.repository }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          dotnet publish Portal.Web/Portal.Web.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            /p:ContainerRegistry=ghcr.io \
            "/p:ContainerRepository=$IMAGE_REPOSITORY" \
            "/p:ContainerImageTags=\"$VERSION;latest\"" \
            "/p:Version=$VERSION" \
            /p:ContainerImageFormat=OCI

      - name: Package and push Helm chart
        env:
          OWNER: ${{ steps.package.outputs.owner }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          helm package ./chart --version "$VERSION" --app-version "$VERSION"
          helm push "portal-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"
