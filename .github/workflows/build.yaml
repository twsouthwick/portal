name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Client/package-lock.json

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb xauth xdotool x11-utils webkit2gtk-driver

      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Install client dependencies
        run: npm ci --prefix Portal.Client

      - name: Build debug client and AppImage
        working-directory: Portal.Client
        run: npm run tauri -- build --debug --bundles appimage

      - name: Upload debug AppImage
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-linux-${{ matrix.arch }}-debug-appimage
          path: Portal.Client/src-tauri/target/debug/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Smoke test client window
        run: xvfb-run -a bash Portal.Client/smoke-linux.sh

      - name: Test client webview
        working-directory: Portal.Client
        run: xvfb-run -a npm run test:e2e

      - name: Upload UI smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-linux-${{ matrix.arch }}-ui-smoke
          path: Portal.Client/artifacts/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Web/package-lock.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$HOME/.aspire/bin" aspire.cli --version 17.0.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.15.4

      - name: Install frontend dependencies
        run: npm ci --prefix Portal.Web

      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Build
        run: dotnet build Portal.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Portal.slnx --no-build --configuration Release

      - name: Lint Helm chart
        run: >-
          helm lint ./chart
          --set oidc.authority=https://identity.example.com
          --set oidc.existingSecret=portal-oidc

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Web/package-lock.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$HOME/.aspire/bin" aspire.cli --version 17.0.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.15.4

      - name: Install frontend dependencies
        run: npm ci --prefix Portal.Web

      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Determine package names and version
        id: package
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          owner="${repository%%/*}"
          version="$(dotnet msbuild Portal.Web/Portal.Web.csproj -target:MinVer -getProperty:MinVerVersion)"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Publish container
        env:
          IMAGE_REPOSITORY: ${{ steps.package.outputs.repository }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          dotnet publish Portal.Web/Portal.Web.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            /p:ContainerRegistry=ghcr.io \
            "/p:ContainerRepository=$IMAGE_REPOSITORY" \
            "/p:ContainerImageTags=\"$VERSION;latest\"" \
            "/p:Version=$VERSION" \
            /p:ContainerImageFormat=OCI

      - name: Package and push Helm chart
        env:
          OWNER: ${{ steps.package.outputs.owner }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          helm package ./chart --version "$VERSION" --app-version "$VERSION"
          helm push "portal-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"
