name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x86_64
            rust: x86_64-pc-windows-msvc
            driver: win64
            gsudo: x64
          - runner: windows-11-arm
            arch: arm64
            rust: aarch64-pc-windows-msvc
            driver: arm64
            gsudo: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Client/package-lock.json

      - name: Set up Rust MSVC
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable-${{ matrix.rust }} --profile minimal
          rustup default stable-${{ matrix.rust }}
          rustc -vV

      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Install client dependencies
        run: npm ci --prefix Portal.Client

      - name: Build debug shell
        working-directory: Portal.Client
        run: npm run tauri -- build --debug --no-bundle

      - name: Upload debug executable
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-windows-${{ matrix.arch }}-debug-exe
          path: Portal.Client/src-tauri/target/debug/portalclient.exe
          if-no-files-found: error

      - name: Verify WebView2 and smoke test window
        run: ./Portal.Client/smoke-windows.ps1

      - name: Install matching Edge WebDriver
        run: ./Portal.Client/setup-webdriver-windows.ps1 -Architecture ${{ matrix.driver }}

      - name: Prepare non-elevated UI tests
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gsudo-2.6.1.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'gsudo-2.6.1'
          Invoke-WebRequest -Uri 'https://github.com/gerardog/gsudo/releases/download/v2.6.1/gsudo.portable.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44') {
            throw 'gsudo archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          Join-Path $directory '${{ matrix.gsudo }}' | Add-Content -LiteralPath $env:GITHUB_PATH
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls $env:GITHUB_WORKSPACE /grant "*${sid}:(OI)(CI)M"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to grant the runner user access to the workspace.' }

      - name: Test client webview
        working-directory: Portal.Client
        env:
          PORTAL_CLIENT_TEST_ADAPTER: ./adapters/windows-tauri.js
        run: |
          $groups = & gsudo --integrity Medium whoami.exe /groups
          if ($LASTEXITCODE -ne 0 -or -not ($groups -match 'S-1-16-8192')) {
            throw 'Could not start the UI tests at medium integrity.'
          }
          gsudo --integrity Medium pwsh -NoProfile -Command "npm run test:e2e"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload UI smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-windows-${{ matrix.arch }}-ui-smoke
          path: Portal.Client/artifacts/
          if-no-files-found: error

  linux-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Client/package-lock.json

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb xauth xdotool x11-utils webkit2gtk-driver

      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: Install client dependencies
        run: npm ci --prefix Portal.Client

      - name: Build debug client and AppImage
        working-directory: Portal.Client
        run: npm run tauri -- build --debug --bundles appimage

      - name: Upload debug AppImage
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-linux-${{ matrix.arch }}-debug-appimage
          path: Portal.Client/src-tauri/target/debug/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Smoke test client window
        run: xvfb-run -a bash Portal.Client/smoke-linux.sh

      - name: Test client webview
        working-directory: Portal.Client
        run: xvfb-run -a npm run test:e2e

      - name: Upload UI smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: portal-client-linux-${{ matrix.arch }}-ui-smoke
          path: Portal.Client/artifacts/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Web/package-lock.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$HOME/.aspire/bin" aspire.cli --version 17.0.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.15.4

      - name: Install frontend dependencies
        run: npm ci --prefix Portal.Web

      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Build
        run: dotnet build Portal.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Portal.slnx --no-build --configuration Release

      - name: Validate container packaging
        run: |
          version="$(dotnet msbuild Portal.Web/Portal.Web.csproj -target:MinVer -getProperty:MinVerVersion)"
          dotnet publish Portal.Web/Portal.Web.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            /p:ContainerRegistry=ghcr.io \
            "/p:ContainerRepository=${GITHUB_REPOSITORY,,}" \
            "/p:ContainerImageTags=\"$version;latest\"" \
            "/p:Version=$version" \
            /p:ContainerImageFormat=OCI \
            "/p:ContainerArchiveOutputPath=$RUNNER_TEMP/portal-container.tar"

      - name: Lint Helm chart
        run: >-
          helm lint ./chart
          --set oidc.authority=https://identity.example.com
          --set oidc.existingSecret=portal-oidc

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Portal.Web/package-lock.json

      - name: Install Aspire CLI
        run: |
          dotnet tool install --tool-path "$HOME/.aspire/bin" aspire.cli --version 17.0.0
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.15.4

      - name: Install frontend dependencies
        run: npm ci --prefix Portal.Web

      - name: Restore
        run: dotnet restore Portal.slnx

      - name: Determine package names and version
        id: package
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          owner="${repository%%/*}"
          version="$(dotnet msbuild Portal.Web/Portal.Web.csproj -target:MinVer -getProperty:MinVerVersion)"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Publish container
        env:
          IMAGE_REPOSITORY: ${{ steps.package.outputs.repository }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          dotnet publish Portal.Web/Portal.Web.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            /p:ContainerRegistry=ghcr.io \
            "/p:ContainerRepository=$IMAGE_REPOSITORY" \
            "/p:ContainerImageTags=\"$VERSION;latest\"" \
            "/p:Version=$VERSION" \
            /p:ContainerImageFormat=OCI

      - name: Package and push Helm chart
        env:
          OWNER: ${{ steps.package.outputs.owner }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          helm package ./chart --version "$VERSION" --app-version "$VERSION"
          helm push "portal-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"
