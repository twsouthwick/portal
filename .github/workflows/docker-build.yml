name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to the Container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract version tags
        id: meta
        run: |
          # Lowercase the repository name
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT
          
          # Determine tags based on event
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "tags=$IMAGE_NAME_LOWER:$VERSION;$IMAGE_NAME_LOWER:latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            echo "tags=$IMAGE_NAME_LOWER:latest;$IMAGE_NAME_LOWER:main" >> $GITHUB_OUTPUT
          else
            BRANCH=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
            echo "tags=$IMAGE_NAME_LOWER:$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Restore dependencies
        run: dotnet restore Portal.Web/Portal.Web.csproj

      - name: Build and publish container
        if: github.event_name != 'pull_request'
        run: |
          IFS=';' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          FIRST_TAG="${TAG_ARRAY[0]}"
          
          dotnet publish Portal.Web/Portal.Web.csproj \
            -c Release \
            /t:PublishContainer \
            /p:ContainerImageName="${FIRST_TAG%:*}" \
            /p:ContainerImageTag="${FIRST_TAG##*:}" \
            /p:ContainerRegistry="${{ env.REGISTRY }}" \
            /p:PublishProfile=DefaultContainer
          
          # Tag and push additional tags
          for tag in "${TAG_ARRAY[@]:1}"; do
            docker tag "$FIRST_TAG" "$tag"
            docker push "$tag"
          done

      - name: Build container (PR only - no push)
        if: github.event_name == 'pull_request'
        run: |
          dotnet publish Portal.Web/Portal.Web.csproj \
            -c Release \
            /t:PublishContainer \
            /p:ContainerImageName="${{ steps.meta.outputs.image_name }}" \
            /p:ContainerImageTag="pr-${{ github.event.pull_request.number }}"
