[workspace]
members = [".", "onboarding", "session"]

[package]
name = "portalclient"
version = "0.1.0"
description = "Portal native client shell"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portalclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Development only: lets debug builds accept http for loopback Portal URLs.
dev-http-loopback = []

[dependencies]
tauri = { version = "2", features = [] }
portal-onboarding = { path = "onboarding" }
portal-session = { path = "session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
url = "2"
keyring-core = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
tauri-plugin-deep-link = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Test-only RSA key generation (portal-session) is very slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
