[package]
name = "portal-session"
version = "0.1.0"
description = "Native sign-in, manifest refresh, and encrypted manifest cache for the Portal client"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
keyring-core = "1.1"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
portal-onboarding = { version = "0.1.0", path = "../onboarding" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
url = "2.5.9"

[dev-dependencies]
rsa = "0.9"
rand = "0.8"
chrono = "0.4"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
